name: Publish to PyPI

# Runs when a GitHub release is published, or by hand from the Actions tab.
# Uses PyPI trusted publishing (OpenID Connect), so no API token is stored
# anywhere. One-time setup and the release routine: docs/releasing.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Version in code, pyproject.toml and release tag agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = open("src/napper_sync/__init__.py", encoding="utf-8").read()
          code = re.search(r'__version__ = "([^"]+)"', init).group(1)
          tag = os.environ.get("TAG", "")
          print(f"pyproject {py} | __version__ {code} | tag {tag or '(manual run)'}")
          if py != code:
              sys.exit("pyproject.toml and __version__ disagree")
          if tag and tag not in (f"v{py}", py):
              sys.exit(f"release tag {tag} does not match version {py}")
          EOF
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/napper-sync --version
          /tmp/smoke/bin/napper-sync categories > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/napper-sync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/napper-sync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

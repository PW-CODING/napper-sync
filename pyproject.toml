[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "napper-sync"
version = "0.1.1"
description = "Unofficial Napper baby-tracker API client, and a sync that imports what the nursery logs in Famly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Patrick Wuestling" }]
keywords = ["napper", "famly", "baby", "baby-tracker", "sleep-tracker", "nursery", "daycare", "childcare", "kita", "krippe", "sync", "api-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
napper-sync = "napper_sync.cli:main"

[project.urls]
Homepage = "https://github.com/PW-CODING/napper-sync"
Issues = "https://github.com/PW-CODING/napper-sync/issues"
Documentation = "https://github.com/PW-CODING/napper-sync/tree/main/docs"
Changelog = "https://github.com/PW-CODING/napper-sync/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
